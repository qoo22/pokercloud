<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カードデザイン確認</title>
<style>
  html,body { margin:0; padding:0; background:#0d1116; color:#e8edf2; min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif; }
  [data-theme="neon"] body { background:#05070f; }
  .wrap { max-width:1000px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .lead { color:#8b97a5; font-size:13px; margin:0 0 18px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  button, select { font:inherit; background:#212a34; color:#e8edf2; border:1px solid #2e3844;
    border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:#d9b45f; }
  h2 { font-size:13px; color:#d9b45f; letter-spacing:.06em; margin:26px 0 10px; }
  .row { display:flex; gap:7px; align-items:center; margin-bottom:9px; flex-wrap:wrap; }
  .rowlabel { width:22px; color:#8b97a5; font-size:16px; flex:0 0 auto; }
  .scene { position:relative; padding:26px; border-radius:150px/100px; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--felt-a) 88%, #fff) 0%, var(--felt-a) 38%, var(--felt-b) 72%, var(--felt-c) 100%);
    border:12px solid var(--rail);
    box-shadow:inset 0 0 70px rgba(0,0,0,.5), 0 10px 34px rgba(0,0,0,.55);
    display:flex; flex-direction:column; align-items:center; gap:16px; min-height:230px; justify-content:center; }
  .scene .board, .scene .hole { display:flex; gap:7px; }
  .note { color:#8b97a5; font-size:12px; line-height:1.7; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>カードデザイン確認</h1>
  <p class="lead">52 枚を並べて崩れが無いかを見るためのページです。テーマとスートの色数を切り替えて確認できます。</p>

  <div class="bar">
    <button id="theme">テーマ：クラシック</button>
    <button id="suits">スート：4色</button>
    <select id="size">
      <option value="sm">小（相手の手札）</option>
      <option value="md" selected>中（ボード）</option>
      <option value="lg">大（自分の手札）</option>
    </select>
    <button id="fx">演出を再生</button>
  </div>

  <h2>卓での見え方</h2>
  <div class="scene" id="scene"></div>

  <h2>全 52 枚</h2>
  <div id="grid"></div>

  <h2>裏面・空きスロット・ハイライト・演出</h2>
  <div id="extras"></div>

  <p class="note">
    ピップ（スート記号）の配置は実際のトランプに合わせてあります。等間隔に並べると「なんとなく安っぽい」印象になり、
    しかも理由が言語化されにくいので直しづらくなります。<br>
    4色スートは色覚特性に配慮した表示です。慣れた方には赤黒 2 色のほうが読みやすいので、設定で切り替えられます。
  </p>
</div>
<script>%BUNDLE%</script>
</body>
</html>
