<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLO POKER</title>
<style>
  :root { --bg:#0d1116; --panel:#171d25; --panel-2:#212a34; --line:#2e3844;
    --text:#e8edf2; --muted:#8b97a5; --gold:#d9b45f; --red:#e05a5a; --green:#4dbd7a; --blue:#5a9de0; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text); min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
    font-size:14px; line-height:1.5; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); padding:9px 16px; transition:.12s; }
  button:hover:not(:disabled){ border-color:var(--gold); background:#2b3542; }
  button:disabled { opacity:.32; cursor:not-allowed; }
  button.primary { background:var(--gold); color:#201704; border-color:var(--gold); font-weight:700; }
  button.danger { border-color:#6a3535; }
  input[type=range]{ accent-color:var(--gold); width:100%; }
  input[type=text]{ font:inherit; background:var(--panel-2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; width:150px; }
  .hidden { display:none !important; }
  .sub { color:var(--muted); font-size:11px; }
  .ok { color:var(--green); }
  .ng { color:var(--red); }

  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .brand { font-weight:800; letter-spacing:.08em; }
  .grow { flex:1; }
  .chip-badge { display:flex; align-items:center; gap:6px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:99px; padding:5px 14px; font-variant-numeric:tabular-nums; }
  .chip-badge b { color:var(--gold); font-size:15px; }
  #rank-badge { border-radius:99px; padding:4px 14px; font-weight:700; color:#0d1116; font-size:12px; }

  #lobby { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:12px; margin:0 0 12px; color:var(--gold); letter-spacing:.08em; }
  .rpbar { height:8px; background:var(--panel-2); border-radius:99px; overflow:hidden; margin:8px 0 6px; }
  .rpbar > div { height:100%; transition:width .4s; }
  #recharge { font-size:12px; line-height:1.7; }
  #recharge b { color:var(--gold); font-variant-numeric:tabular-nums; }

  .tables { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .tcard { background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:13px; }
  .tcard.locked { opacity:.5; }
  .tcard h3 { margin:0 0 3px; font-size:14px; }
  .tcard .blinds { color:var(--gold); font-size:12px; font-variant-numeric:tabular-nums; }
  .tcard dl { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:11px; color:var(--muted); margin:9px 0; }
  .tcard dd { margin:0; text-align:right; color:var(--text); font-variant-numeric:tabular-nums; }
  .tcard button { width:100%; padding:7px; font-size:13px; }

  .ach { background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:9px 12px; margin-bottom:7px; }
  .ach.done { border-color:rgba(77,189,122,.4); }
  .ach .nm { font-size:13px; }
  .ach .rp { color:var(--gold); font-size:11px; margin-left:6px; }
  .bar { height:6px; background:#151b23; border-radius:99px; overflow:hidden; margin:5px 0; }
  .bar > div { height:100%; background:var(--gold); transition:width .4s; }

  #table-view { display:grid; grid-template-columns:1fr 300px; gap:14px; padding:14px; max-width:1280px; margin:0 auto; }
  @media (max-width:960px){ #table-view { grid-template-columns:1fr; } }
  .felt { position:relative; width:100%; aspect-ratio:16/10; min-height:400px;
    border:12px solid var(--rail); border-radius:200px/130px;
    box-shadow:inset 0 0 70px rgba(0,0,0,.5), 0 10px 34px rgba(0,0,0,.55); overflow:hidden; }
  .center { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); text-align:center; width:92%; }
  .board { display:flex; gap:7px; justify-content:center; min-height:80px; align-items:center; }
  .pot { margin-top:8px; font-size:12px; color:var(--gold); font-variant-numeric:tabular-nums; }
  .pot b { font-size:19px; color:#fff; display:inline-block; }
  .street-tag { display:inline-block; margin-bottom:6px; font-size:11px; letter-spacing:.14em;
    color:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.22); border-radius:99px; padding:1px 10px; }

  .seat { position:absolute; transform:translate(-50%,-50%); width:156px; text-align:center; }
  .seat .cards { display:flex; gap:3px; justify-content:center; margin-bottom:4px; min-height:48px; align-items:flex-end; }
  .seat .box { background:rgba(8,14,18,.85); border:1px solid rgba(255,255,255,.14);
    border-radius:9px; padding:5px 6px; }
  .seat.folded { opacity:.34; }
  .seat .nm { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seat .st { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
  .seat .bet { margin-top:4px; font-size:11px; color:var(--gold); min-height:16px; font-variant-numeric:tabular-nums; }
  .seat .tag { color:rgba(255,255,255,.32); font-size:10px; }
  .badge { display:inline-block; font-size:9px; padding:0 5px; border-radius:99px; margin-left:3px;
    background:var(--gold); color:#1a1206; font-weight:700; vertical-align:middle; }
  .badge.allin{background:var(--red);color:#fff;} .badge.win{background:var(--green);color:#062514;}
  .badge.you{background:var(--blue);color:#fff;}

  /* 直前のアクションの吹き出し。
     色で種類、文字で金額。ログを読まずに卓だけ見て分かるのが目的 */
  .act-bubble { position:absolute; left:50%; top:-14px; transform:translateX(-50%);
    padding:3px 11px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap;
    z-index:8; box-shadow:0 3px 10px rgba(0,0,0,.5); animation:actPop .34s cubic-bezier(.2,1.5,.4,1);
    font-variant-numeric:tabular-nums; }
  .act-bubble.fold  { background:#3a444f; color:#aab4bf; }
  .act-bubble.check { background:#3f5b6e; color:#dbeaf5; }
  .act-bubble.call  { background:#2f7d5a; color:#eafff3; }
  .act-bubble.bet,
  .act-bubble.raise { background:linear-gradient(135deg,#e0a13a,#c2761c); color:#2b1a02; }
  .act-bubble.allin { background:linear-gradient(135deg,#ff5a5a,#a81f1f); color:#fff;
    box-shadow:0 0 0 2px rgba(255,120,120,.5), 0 4px 16px rgba(255,60,60,.45);
    animation:actPop .34s cubic-bezier(.2,1.5,.4,1), allinPulse 1.1s ease-in-out .34s infinite; }
  @keyframes actPop { from { opacity:0; transform:translateX(-50%) translateY(8px) scale(.8); }
                      to   { opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }
  @keyframes allinPulse { 0%,100% { transform:translateX(-50%) scale(1); }
                          50%     { transform:translateX(-50%) scale(1.07); } }

  /* オールイン中の勝率バー */
  .eq { margin-top:5px; }
  .eq-bar { height:5px; background:rgba(255,255,255,.14); border-radius:99px; overflow:hidden; }
  .eq-bar > div { height:100%; background:linear-gradient(90deg,#5a9de0,#8fd3ff); transition:width .5s ease; }
  .eq.lead .eq-bar > div { background:linear-gradient(90deg,#d9b45f,#ffe9a8); }
  .eq-num { font-size:11px; margin-top:2px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .eq.lead .eq-num { color:var(--gold); font-weight:700; }
  .eq .outs { color:#8fd3ff; }
  .eq .lead-tag { color:var(--gold); }

  .street-tag.hot { color:#ffd76a; border-color:rgba(255,215,106,.6);
    background:rgba(255,90,90,.12); animation:hotPulse 1.2s ease-in-out infinite; }
  @keyframes hotPulse { 0%,100% { opacity:1; } 50% { opacity:.55; } }

  @media (prefers-reduced-motion: reduce) {
    .act-bubble, .act-bubble.allin, .street-tag.hot { animation:none !important; }
  }

  .actions { margin-top:12px; min-height:110px; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; }
  .btnrow.main button { flex:1; min-width:100px; padding:14px 8px; font-size:15px; font-weight:600; }
  button.chip { padding:5px 10px; font-size:12px; }
  .slider-wrap { margin-top:10px; }
  .hint { font-size:12px; color:var(--muted); padding:20px 0; text-align:center; }

  .side { display:flex; flex-direction:column; gap:12px; }
  .log { height:280px; overflow-y:auto; font-size:12px; font-family:ui-monospace,Menlo,monospace; }
  .log div { padding:2px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .log .hl { color:var(--gold); } .log .win { color:var(--green); } .log .ng { color:var(--red); }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex;
    align-items:center; justify-content:center; z-index:60; padding:20px; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:22px; width:min(560px,94vw); max-height:92vh; overflow-y:auto; }
  .modal h3 { margin:0 0 12px; font-size:17px; }
  .modal .lead { font-size:13px; color:var(--muted); margin:0 0 10px; line-height:1.8; }
  .modal .lead b { color:var(--gold); }
  .modal .row { display:flex; gap:8px; margin-top:12px; }
  .modal .row button { flex:1; }
  .share-preview { background:#0a0e13; border-radius:10px; min-height:180px; display:flex;
    align-items:center; justify-content:center; color:var(--muted); font-size:12px; }

  #toast { position:fixed; right:16px; bottom:16px; z-index:70; display:flex; flex-direction:column; gap:8px; }
  .toast-item { background:linear-gradient(135deg,var(--gold),#8a6a22); color:#1a1206;
    padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.5); animation:toastIn .3s cubic-bezier(.2,1.4,.4,1); }
  .toast-item .rp { margin-left:8px; opacity:.75; }
  @keyframes toastIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:none; } }
</style>
</head>

  <span class="brand">♠ SOLO POKER</span>
  <span id="rank-badge">ルーキー</span>
  <span class="chip-badge">💰 <b id="chips">0</b></span>
  <span class="grow"></span>

    <div style="margin-top:12px"><button class="chip danger" id="btn-reset">記録を消去</button></div>
  </div>
</div>

<div id="table-view" class="hidden">
  <div>
    <div class="sub" id="stake-name" style="margin-bottom:8px"></div>
    <div class="felt" id="felt"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="side">
    <div class="panel">
      <h2>ログ</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

          const hv = evaluateBest([...p.holeCards, ...this.board]);
          hands[p.seat] = hv;
          this.events.push({
            type: "showdown",
            seat: p.seat,
            cards: p.holeCards.slice(),
            hand: describeHand(hv)
          });
        }
      }
      const sawFlop = this.board.length >= 3;
      const potResults = [];
      let totalRake = 0;
      for (const pot of pots) {
        let winners;
        if (!reachedShowdown) {
          winners = pot.eligible.filter((s) => !this.players[s].folded);
        } else {
          const candidates = this.players.map(
            (p) => pot.eligible.includes(p.seat) ? hands[p.seat] : null
          );
          winners = findWinners(candidates);
        }
        const rake = computeRake(pot.amount, this.rakePercent, this.rakeCap, sawFlop);
        totalRake += rake;
        const distributable = { ...pot, amount: pot.amount - rake };
        const award = awardPot(distributable, winners, this.buttonIndex, this.players.length);
        for (const [seat, amt] of award.shares) {
          this.players[seat].stack += amt;
          this.events.push({ type: "award", seat, amount: amt, potLevel: pot.level });
        }
        potResults.push({ pot, rake, winners, shares: award.shares });
      }
      if (totalRake > 0) this.events.push({ type: "rake", amount: totalRake });
      this.events.push({ type: "hand_end" });
      this.street = "complete";
      this.result = {
        pots: potResults,
        uncalledReturn: uncalled,
        totalRake,
        showdown: reachedShowdown,
        hands,
        netChange: this.players.map((p) => p.stack - p.startingStack)
      };
    }
    // -------------------------------------------------------------------------
    // 状態の取得
    // -------------------------------------------------------------------------
    get totalPot() {
      return this.players.reduce((sum, p) => sum + p.totalBet, 0);
    }
    get isComplete() {
      return this.street === "complete";
    }
    /**
     * 指定席から見える状態。他人のホールカードは含まない。
     * ショーダウン後は公開された手札のみ含める。
     */
    getStateFor(seat) {
      return {
        street: this.street,
        board: this.board.slice(),
        pot: this.totalPot,
        currentBet: this.currentBet,
        minRaiseSize: this.lastRaiseSize,
        actingSeat: this.actingSeat,
        buttonIndex: this.buttonIndex,
        smallBlind: this.smallBlind,
        bigBlind: this.bigBlind,
        legalActions: seat !== null && seat === this.actingSeat ? this.getLegalActions(seat) : [],
        players: this.players.map((p) => ({
          seat: p.seat,
          id: p.id,
          name: p.name,
          stack: p.stack,
          streetBet: p.streetBet,
          totalBet: p.totalBet,
          folded: p.folded,
          allIn: p.allIn,
          lastAction: p.lastAction,
          holeCards: p.seat === seat || this.isComplete && this.result?.showdown && !p.folded ? p.holeCards.slice() : null
        })),
        result: this.result
      };
    }
    /**
     * 配牌前にクライアントへ送るコミットメント。
     * Provably Fair を有効にしていない場合は null。
     *
     * サーバー実装では、これを送ってからでなければカードを配ってはいけない。
     * 順序を逆にすると仕組み全体が意味を失う。
     */
    getFairnessCommitment() {
      return this.fairness ? this.fairness.getCommitment() : null;
    }
    /**
     * ハンド終了後に serverSeed を開示する。
     * 進行中に呼ぶと、そのハンドの残りのカードが計算できてしまうため例外にしている。
     */
    revealFairness() {
      if (!this.fairness) throw new Error("\u3053\u306E\u30CF\u30F3\u30C9\u306F Provably Fair \u3092\u6709\u52B9\u306B\u3057\u3066\u3044\u307E\u305B\u3093");
      if (!this.isComplete) throw new Error("\u30CF\u30F3\u30C9\u304C\u7D42\u4E86\u3059\u308B\u524D\u306B\u30B7\u30FC\u30C9\u3092\u958B\u793A\u3059\u308B\u3053\u3068\u306F\u3067\u304D\u307E\u305B\u3093");
      return this.fairness.reveal();
    }
    /** ハンド履歴（配布順のデッキ全体を含む）。Provably Fair の検証に使う */
    getHandHistory() {
      return {
        button: this.buttonIndex,
        blinds: { sb: this.smallBlind, bb: this.bigBlind, ante: this.ante, straddles: this.straddles },
        seats: this.players.map((p) => ({
          seat: p.seat,
          id: p.id,
          startingStack: p.startingStack,
          holeCards: p.holeCards.map(cardToString)
        })),
        board: this.board.map(cardToString),
        deckOrder: this.deckOrder.map(cardToString),
        events: this.events,
        result: this.result,
        // 終了後のみシードを含める。進行中は commitment だけ
        fairness: this.fairness ? this.isComplete ? this.fairness.reveal() : this.fairness.getCommitment() : null
      };
    }
  };

      const p = h.players[i];
      const k = i;
      const a = (180 + k * 360 / n) * Math.PI / 180;
      const x = 50 + 40 * Math.sin(a);
      const y = 47 - 36 * Math.cos(a);
      const isMe = i === 0;
      const open = isMe || (reveal ? reveal.open.has(i) : showdownOpen && !p.folded);
      const cards = p.folded && h.isComplete && !reveal ? "" : open ? p.holeCards.map((c) => cardFace(cardToDisplay(c), {
        size: isMe ? "lg" : "sm",
        highlight: !reveal && lastWinningCards.has(cardToDisplay(c)),
        extra: (showdownOpen || reveal) && !isMe ? "flipping" : ""
      })).join("") : cardBack({ size: "sm" }) + cardBack({ size: "sm" });
      const cpu = cpus.find((c) => c.seat === i);
      const badges = (i === h.buttonIndex ? '<span class="badge">D</span>' : "") + (isMe ? '<span class="badge you">YOU</span>' : "") + (p.allIn ? '<span class="badge allin">ALL IN</span>' : "") + (!reveal && lastSummaryWinners.has(i) ? '<span class="badge win">WIN</span>' : "");
      const act = seatActions.get(i);
      const bubble = act ? `<div class="act-bubble ${act.kind}" data-nonce="${act.nonce}">${act.label}</div>` : "";
      let eq = "";
      if (step) {
        const e = step.equity.find((x2) => x2.seat === i);
        const o = step.outs.find((x2) => x2.seat === i);
        if (e) {
          const percent = Math.round(e.equity * 100);
          const leading = step.leaders.includes(i);
          eq = `<div class="eq ${leading ? "lead" : ""}">
          <div class="eq-bar"><div style="width:${percent}%"></div></div>
          <div class="eq-num">${percent}%${o && !o.leading && o.cards.length ? ` <span class="outs">\u30A2\u30A6\u30C4 ${o.cards.length}</span>` : ""}${leading ? ' <span class="lead-tag">\u9996\u4F4D</span>' : ""}</div>
        </div>`;
        }
      }
      html += `<div class="seat ${h.actingSeat === i && !reveal ? "acting" : ""} ${p.folded && !reveal ? "folded" : ""}"
        data-seat="${i}" style="left:${x}%;top:${y}%">
      ${bubble}
      <div class="cards">${cards}</div>
      <div class="box">
        <div class="nm">${escapeHtml(p.name)}${badges}</div>
        <div class="st">${fmt2(p.stack)}</div>
        ${eq}
      </div>
      <div class="bet">${p.streetBet > 0 ? `\u25B8 ${fmt2(p.streetBet)}` : cpu && !p.folded ? `<span class="tag">${cpu.profile.tagline.slice(0, 10)}</span>` : ""}</div>
    </div>`;
    }
    felt.innerHTML = html;
    const potEl = felt.querySelector(".pot");
    if (potEl) bumpPot(potEl);
    renderActions();
  }
  function renderActions() {
    const box = $("actions");
    const h = hand;
    const leave = $("btn-leave");
    const inHand = !!(h && !h.isComplete);
    leave.disabled = inHand;
    leave.title = inHand ? "\u30CF\u30F3\u30C9\u304C\u7D42\u308F\u3063\u3066\u304B\u3089\u964D\u308A\u3089\u308C\u307E\u3059" : "";
    if (!h || h.isComplete || h.actingSeat !== 0 || busy) {
      box.innerHTML = h?.isComplete ? '<div class="hint">\u6B21\u306E\u30CF\u30F3\u30C9\u3092\u914D\u3063\u3066\u3044\u307E\u3059\u2026</div>' : '<div class="hint">\u76F8\u624B\u304C\u8003\u3048\u3066\u3044\u307E\u3059\u2026</div>';
      return;
    }
    const legal = h.getLegalActions(0);
    const check = legal.find((a) => a.type === "check");
    const call = legal.find((a) => a.type === "call");
    const raise = legal.find((a) => a.type === "raise" || a.type === "bet");
    let html = '<div class="btnrow main">';
    html += `<button class="danger" data-act="fold">\u30D5\u30A9\u30FC\u30EB\u30C9</button>`;
    if (check) html += `<button data-act="check">\u30C1\u30A7\u30C3\u30AF</button>`;
    if (call) html += `<button data-act="call">\u30B3\u30FC\u30EB ${fmt2(call.amount ?? 0)}</button>`;
    if (raise) html += `<button class="primary" data-act="raise">${raise.type === "bet" ? "\u30D9\u30C3\u30C8" : "\u30EC\u30A4\u30BA"} <span id="rv">${fmt2(raise.min)}</span></button>`;
    html += "</div>";
    if (raise) {
      const clamp = (v) => Math.max(raise.min, Math.min(raise.max, Math.round(v)));
      const presets = [
        ["1/2", clamp(h.totalPot * 0.5 + h.currentBet)],
        ["2/3", clamp(h.totalPot * 0.66 + h.currentBet)],
        ["\u30DD\u30C3\u30C8", clamp(h.totalPot + h.currentBet)],
        ["\u30AA\u30FC\u30EB\u30A4\u30F3", raise.max]
      ];
      html += `<div class="slider-wrap">
      <input type="range" id="rs" min="${raise.min}" max="${raise.max}" step="1" value="${raise.min}">
      <div class="btnrow">${presets.map(([l, v]) => `<button class="chip" data-set="${v}">${l}<br><span class="sub">${fmt2(v)}</span></button>`).join("")}</div>
    </div>`;
    }
    box.innerHTML = html;
    const slider = document.getElementById("rs");
    if (slider) {
      slider.oninput = () => {
        const v = document.getElementById("rv");
        if (v) v.textContent = fmt2(+slider.value);
      };
    }
    each("[data-act]", (b) => {
      b.onclick = () => {
        const a = b.dataset.act;
        if (a === "raise" && raise && slider) heroAct(raise.type, +slider.value);
        else heroAct(a);
      };
    });
    each("[data-set]", (b) => {
      b.onclick = () => {
        if (!slider) return;
        slider.value = b.dataset.set;
        const v = document.getElementById("rv");
        if (v) v.textContent = fmt2(+slider.value);
      };
    });
  }
  var ACTION_JA = {
    fold: "\u30D5\u30A9\u30FC\u30EB\u30C9",
    check: "\u30C1\u30A7\u30C3\u30AF",
    call: "\u30B3\u30FC\u30EB",
    bet: "\u30D9\u30C3\u30C8",
    raise: "\u30EC\u30A4\u30BA"
  };
  function logAction(seat, action, h) {
    const p = h.players[seat];
    const amt = p.streetBet > 0 && (action === "bet" || action === "raise" || action === "call") ? ` ${fmt2(p.streetBet)}` : "";
    log(`${p.name} ${ACTION_JA[action]}${amt}${p.allIn ? "\uFF08ALL IN\uFF09" : ""}`);
    const kind = p.allIn ? "allin" : action === "bet" || action === "raise" ? action : action === "call" ? "call" : action === "check" ? "check" : "fold";
    const label2 = p.allIn ? `ALL IN ${fmt2(p.streetBet)}` : action === "fold" ? "\u30D5\u30A9\u30FC\u30EB\u30C9" : action === "check" ? "\u30C1\u30A7\u30C3\u30AF" : `${ACTION_JA[action]} ${fmt2(p.streetBet)}`;
    seatActions.set(seat, { kind, label: label2, nonce: ++actionNonce });
    playAction(action, p.allIn);
    if (p.allIn) flashAllIn($("felt"));
  }
  function log(text, cls = "") {
    const box = $("log");
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    box.appendChild(div);
    while (box.childElementCount > 150) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  function modal(html, wire) {
    const root = $("modal-root");
    root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
    const close = () => root.innerHTML = "";
    wire(close);
  }
  function showBustDialog() {
    play("bust");
    const r = profile.rank;
    const ms = profile.msUntilNextRecharge();
    const canSitAgain = profile.data.chips >= (STAKES[0]?.buyIn ?? 0);
    modal(
      `<h3>\u30C1\u30C3\u30D7\u304C\u5C3D\u304D\u307E\u3057\u305F</h3>
     <p class="lead">\u624B\u6301\u3061\u306F <b>${fmt2(profile.data.chips)}</b>\u3002\u88DC\u5145\u306F <b>${Math.round(r.rechargeIntervalMs / 6e4)}\u5206\u3054\u3068\u306B ${fmt2(r.rechargeAmount)}</b>\u3001\u4E0A\u9650\u306F <b>${fmt2(r.rechargeCap)}</b> \u3067\u3059\u3002</p>
     <p class="lead sub">${ms !== null ? `\u6B21\u306E\u88DC\u5145\u307E\u3067 ${fmtDuration(ms)}\u3002` : ""}\u88DC\u5145\u3060\u3051\u3067\u306F\u4E0A\u306E\u5353\u306B\u306F\u623B\u308C\u307E\u305B\u3093\u3002\u4E0B\u306E\u5353\u3067\u7D44\u307F\u7ACB\u3066\u76F4\u3057\u3066\u304F\u3060\u3055\u3044\u3002</p>
     <div class="row">
       <button id="bd-ok" class="${canSitAgain ? "primary" : ""}">${canSitAgain ? "\u30ED\u30D3\u30FC\u3078" : "\u5F85\u3064"}</button>
     </div>`,
      (close) => {
        $("bd-ok").onclick = () => {
          close();
          leaveTable();
        };
      }
    );
  }
  function showAchievementToast(list) {
    const box = $("toast");
    for (const a of list) {
      const el = document.createElement("div");
      el.className = "toast-item";
      el.innerHTML = `<b>\u5B9F\u7E3E\u89E3\u9664</b> ${a.name}<span class="rp">+${a.rp} RP</span>`;
      box.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }
    renderHud();
  }
  async function openShare() {
    modal(
      `<h3>\u6210\u7E3E\u30AB\u30FC\u30C9</h3>
     <div id="share-preview" class="share-preview">\u751F\u6210\u4E2D\u2026</div>
     <div class="row">
       <button id="sh-copy">\u753B\u50CF\u3092\u30B3\u30D4\u30FC</button>
       <button id="sh-save" class="primary">\u4FDD\u5B58</button>
     </div>
     <div class="row">
       <button id="sh-text">\u6587\u9762\u3092\u30B3\u30D4\u30FC</button>
       <button id="sh-close">\u9589\u3058\u308B</button>
     </div>`,
      (close) => {
        $("sh-close").onclick = close;
        void (async () => {
          const canvas = await renderShareCard({ profile, highlight });
          const prev = $("share-preview");
          prev.innerHTML = "";
          canvas.style.width = "100%";
          canvas.style.borderRadius = "10px";
          prev.appendChild(canvas);
          $("sh-save").onclick = () => downloadCard(canvas, `poker-${profile.rank.key}-${Date.now()}.png`);
          $("sh-copy").onclick = async () => {
            const ok = await copyCard(canvas);
            $("sh-copy").textContent = ok ? "\u30B3\u30D4\u30FC\u3057\u307E\u3057\u305F" : "\u30B3\u30D4\u30FC\u975E\u5BFE\u5FDC\uFF08\u4FDD\u5B58\u3092\u4F7F\u3063\u3066\u304F\u3060\u3055\u3044\uFF09";
          };
          $("sh-text").onclick = async () => {
            try {
              await navigator.clipboard.writeText(shareText(profile));
              $("sh-text").textContent = "\u30B3\u30D4\u30FC\u3057\u307E\u3057\u305F";
            } catch {
              $("sh-text").textContent = "\u30B3\u30D4\u30FC\u3067\u304D\u307E\u305B\u3093\u3067\u3057\u305F";
            }
          };
        })();
      }
    );
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }
  var styleEl = document.createElement("style");
  styleEl.textContent = VISUAL_CSS;
  document.head.appendChild(styleEl);
  function applyTheme(next) {
    theme = next;
    document.documentElement.setAttribute("data-theme", next);
    try {
      localStorage.setItem("poker.solo.theme", next);
    } catch {
    }
    $("btn-theme").textContent = next === "classic" ? "\u{1F3A8} \u30AF\u30E9\u30B7\u30C3\u30AF" : "\u{1F3A8} \u30CD\u30AA\u30F3";
  }
  var savedTheme = "classic";
  try {
    savedTheme = localStorage.getItem("poker.solo.theme") ?? "classic";
  } catch {
  }
  applyTheme(savedTheme);
  document.documentElement.setAttribute("data-suits", "four");
  $("btn-theme").onclick = () => applyTheme(theme === "classic" ? "neon" : "classic");
  function syncMuteButton() {
    const b = $("btn-mute");
    b.textContent = isMuted() ? "\u{1F507} \u97F3\u30AA\u30D5" : "\u{1F50A} \u97F3\u30AA\u30F3";
    b.title = isMuted() ? "\u52B9\u679C\u97F3\u3092\u9CF4\u3089\u3059" : "\u52B9\u679C\u97F3\u3092\u6B62\u3081\u308B";
  }
  $("btn-mute").onclick = () => {
    setMuted(!isMuted());
    syncMuteButton();
    if (!isMuted()) play("click");
  };
  syncMuteButton();
  document.addEventListener("pointerdown", () => unlockAudio(), { once: true });
  $("btn-share").onclick = () => void openShare();
  $("btn-leave").onclick = leaveTable;
  $("btn-reset").onclick = () => {
    modal(
      `<h3>\u8A18\u9332\u3092\u6D88\u53BB\u3057\u307E\u3059\u304B</h3>
     <p class="lead">\u30C1\u30C3\u30D7\u30FB\u5B9F\u7E3E\u30FB\u79F0\u53F7\u304C\u3059\u3079\u3066\u521D\u671F\u72B6\u614B\u306B\u623B\u308A\u307E\u3059\u3002\u5143\u306B\u306F\u623B\u305B\u307E\u305B\u3093\u3002</p>
     <div class="row"><button id="rs-no">\u3084\u3081\u308B</button><button id="rs-yes" class="danger">\u6D88\u53BB\u3059\u308B</button></div>`,
      (close) => {
        $("rs-no").onclick = close;
        $("rs-yes").onclick = () => {
          profile.reset();
          close();
          renderLobby();
        };
      }
    );
  };
  var nameInput = $("player-name");
  nameInput.value = profile.data.playerName;
  nameInput.onchange = () => {
    profile.data.playerName = nameInput.value.trim().slice(0, 16) || "\u3042\u306A\u305F";
    nameInput.value = profile.data.playerName;
    profile.save();
  };
  setInterval(() => {
    if (!$("lobby").classList.contains("hidden")) renderHud();
  }, 1e3);
  renderLobby();
})();
</script>
